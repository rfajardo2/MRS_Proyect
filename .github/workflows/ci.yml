name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore MRSDrunk.sln

      - name: Build
        run: dotnet build MRSDrunk.sln -c Release --no-restore

      - name: Test
        run: dotnet test MRSDrunk.sln -c Release --no-build
